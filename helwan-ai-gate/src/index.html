<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helwan AI Gate</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      font-family: 'Cairo', sans-serif; background-color: #221122;
    }
    header {
      background: linear-gradient(#443355, #221122); padding: 1em; color: gold;
      font-size: 1.5em; display: flex; align-items: center;
      justify-content: space-between; gap: 10px;
    }
    #header-center-content {
      display: flex; align-items: center; justify-content: flex-start;
      flex-grow: 1; gap: 15px; min-width: 0;
    }
    #header-icon { height: 40px; border-radius: 5px; }
    #nav-buttons-container { display: flex; gap: 5px; margin-left: 1em; }
    .nav-button {
      background: #556677; color: white; border: none; padding: 8px 12px;
      border-radius: 5px; cursor: pointer; font-size: 1.2em;
    }
    .nav-button.reload-btn { padding: 8px 10px; font-size: 1.1em; }
    .nav-button:hover:not(:disabled) { background: #667788; }
    .nav-button:disabled { opacity: 0.4; cursor: default; }
    #url-bar {
      flex-grow: 1; min-width: 80px; padding: 5px 10px; border-radius: 5px;
      border: 1px solid #778899; background-color: #f0f0f0;
      font-size: 1em; height: 30px; box-sizing: border-box;
    }
    #header-tools { display: flex; align-items: center; gap: 10px; margin-left: 10px; }
    #clock-display { color: gold; font-weight: bold; font-size: 1.1em; }
    #notepad-btn {
      background: #e67e22; color: white; border: none; padding: 5px 10px;
      border-radius: 5px; cursor: pointer;
    }
    #container { display: flex; height: calc(100vh - 66px); width: 100%; }
    #sidebar {
      width: 250px; background-color: #2c3e50; color: white; height: 100%;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    #site-buttons-wrapper {
      display: flex; flex-direction: column; flex-grow: 1;
      padding: 1rem; overflow-y: auto;
    }
    #site-buttons-container { flex-grow: 1; }
    .site-button {
      width: 100%; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 5px;
      border: none; font-size: 1em; background: #3498db; color: white;
      cursor: pointer; text-align: left; flex-shrink: 0;
    }
    .site-button:hover { background: #2980b9; }
    .site-button div {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
    }
    .site-button span { flex-grow: 1; text-align: left; }
    .delete-site-btn {
      cursor: pointer; color: #8B4513; font-weight: bold; margin-left: 10px;
      padding: 2px 5px; border-radius: 3px; font-size: 0.8em;
    }
    .delete-site-btn:hover { background-color: rgba(255,255,255,0.2); }
    #content {
      flex: 1; display: flex; flex-direction: column; background: #ecf0f1;
      position: relative; overflow: hidden; min-width: 0;
    }
    #tabs-container {
      display: none; overflow-x: auto; white-space: nowrap;
      background-color: #334455; padding-top: 5px; flex-shrink: 0;
      border-bottom: 1px solid #554466;
    }
    .tab {
      display: inline-flex; align-items: center; padding: 10px 15px;
      cursor: pointer; background-color: #445566; color: #ddd;
      border-top-left-radius: 8px; border-top-right-radius: 8px;
      margin-right: 2px; white-space: nowrap; position: relative;
    }
    .tab:hover { background-color: #556677; }
    .tab.active { background-color: #ecf0f1; color: #2c3e50; }
    .tab-close { margin-left: 10px; font-weight: bold; color: #ddd; font-size: 1.2em; }
    .tab.active .tab-close { color: #2c3e50; }
    webview, #welcome-page {
      flex: 1; width: 100%; height: 100% !important; border: none;
      display: none; min-height: 0; box-sizing: border-box; position: relative;
    }
    webview.active, #welcome-page { display: flex; }
    #welcome-page {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; color: #333; font-size: 1.2em; text-align: center; padding: 20px;
    }
    #add-site-form-container {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background-color: #ecf0f1; padding: 2em; border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 100; display: none;
    }
    #add-site-form-container input {
      width: 100%; padding: 10px; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
    }
    #add-site-form-container button {
      background: #3498db; color: white; padding: 10px 20px;
      border: none; border-radius: 5px; cursor: pointer;
    }
    #add-site-form-container button:hover { background: #2980b9; }
    .add-site-button { background-color: #e74c3c; margin-top: 1rem; }
    .add-site-button:hover { background-color: #c0392b; }
    #notepad-container {
      position: absolute; top: 60px; right: 10px; width: 320px; height: 420px;
      background: #ecf0f1; border-radius: 10px; padding: 10px; display: none;
      flex-direction: column; z-index: 200; box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    #notepad-text {
      flex: 1; width: 100%; resize: none; padding: 8px; box-sizing: border-box;
      border-radius: 6px; border: 1px solid #ccc;
    }
    #notepad-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
    #notepad-actions button {
      padding: 6px 10px; border-radius: 6px; border: none;
      cursor: pointer; background: #3498db; color: white;
    }
  </style>
</head>
<body>
  <header>
    <div id="nav-buttons-container">
      <button id="back-button" class="nav-button" disabled>&#9664;</button>
      <button id="forward-button" class="nav-button" disabled>&#9654;</button>
      <button id="reload-button" class="nav-button reload-btn" disabled>&#x21BB;</button>
    </div>

    <div id="header-center-content">
      <img id="header-icon" src="ai.png" alt="AI Icon">
      Helwan AI Gate
      <input type="text" id="url-bar" placeholder="Enter URL or command and Hit Enter...">
      <div id="header-tools">
        <span id="clock-display">--:--:--</span>
        <button id="notepad-btn">📝 Notepad</button>
      </div>
    </div>
    <div></div>
  </header>

  <div id="container">
    <div id="sidebar">
      <div id="site-buttons-wrapper">
        <div id="site-buttons-container"></div>
        <button class="site-button add-site-button" onclick="showAddSiteForm()">+ Add New Site</button>
      </div>
    </div>

    <div id="content">
      <div id="tabs-container"></div>
      <div id="welcome-page">
        <h1>Welcome to Helwan AI Gate</h1>
        <p>Please select a site from the sidebar or add a new one to start.</p>
      </div>
    </div>
  </div>

  <div id="add-site-form-container">
    <h2>Add New Site</h2>
    <form id="add-site-form">
      <input type="text" id="site-name-input" placeholder="Site Name (English Only)" required>
      <input type="url" id="site-url-input" placeholder="https://example.com" required>
      <button type="submit">Add Site</button>
      <button type="button" onclick="hideAddSiteForm()">Cancel</button>
    </form>
  </div>

  <div id="notepad-container" aria-hidden="true">
    <textarea id="notepad-text" placeholder="Write your notes here..."></textarea>
    <div id="notepad-actions">
      <button id="notepad-close-btn">Close</button>
      <button id="notepad-clear-btn">Clear</button>
    </div>
  </div>

  <script>
    console.log('Helwan AI Gate renderer started');

    let tabs = {};
    let activeTabId = null;

    const backButton = document.getElementById('back-button');
    const forwardButton = document.getElementById('forward-button');
    const reloadButton = document.getElementById('reload-button');
    const urlBar = document.getElementById('url-bar');

    function $id(id) { return document.getElementById(id); }

    function loadSites() {
      if (window.electronAPI && typeof window.electronAPI.getSites === 'function') {
        window.electronAPI.getSites();
      }
    }

    function updateNavButtons(webview) {
      if (!backButton || !forwardButton || !reloadButton) return;
      if (!webview) {
        backButton.disabled = true;
        forwardButton.disabled = true;
        reloadButton.disabled = true;
        return;
      }
      try {
        backButton.disabled = !webview.canGoBack();
        forwardButton.disabled = !webview.canGoForward();
        reloadButton.disabled = false;
      } catch (_error) {
        backButton.disabled = true;
        forwardButton.disabled = true;
        reloadButton.disabled = false;
      }
    }

    function updateUrlBar(url) {
      if (urlBar) urlBar.value = url || '';
    }

    function renderSites(data) {
      const container = $id('site-buttons-container');
      if (!container) return;
      container.innerHTML = '';

      const sortedData = Array.isArray(data)
        ? data.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'en'))
        : [];

      sortedData.forEach(site => {
        const button = document.createElement('button');
        button.className = 'site-button';

        const content = document.createElement('div');
        const nameSpan = document.createElement('span');
        nameSpan.textContent = site.name || site.url || 'Untitled';
        nameSpan.onclick = () => createTab(site.url, `site-${Date.now()}`, site.name);

        const deleteBtn = document.createElement('span');
        deleteBtn.className = 'delete-site-btn';
        deleteBtn.textContent = '🗑';
        deleteBtn.title = `Delete ${site.name || site.url || 'site'}`;
        deleteBtn.onclick = (event) => {
          event.stopPropagation();
          if (confirm(`Are you sure you want to delete the site "${site.name}"?`)) {
            window.electronAPI.deleteSite(site.name);
          }
        };

        content.appendChild(nameSpan);
        content.appendChild(deleteBtn);
        button.appendChild(content);
        container.appendChild(button);
      });
    }

    function injectGeminiFix(webviewElement) {
      if (!webviewElement || typeof webviewElement.executeJavaScript !== 'function') return;
      const injectionCode = `
        (function() {
          try {
            if (!document.getElementById('__helwan_gemini_fix')) {
              const style = document.createElement('style');
              style.id = '__helwan_gemini_fix';
              style.textContent = \`
                html, body, div[data-testid="scrolling-container"] {
                  overflow: auto !important;
                  overflow-x: hidden !important;
                }
                div[role="main"] > div:last-child,
                div[role="contentinfo"], [role="banner"],
                div[data-testid="bottom-rail"] {
                  position: static !important; z-index: 1 !important;
                }
                div[role="main"] { padding-bottom: 400px !important; }
              \`;
              document.head && document.head.appendChild(style);
            }
          } catch (error) {
            console.error('Helwan Gemini fix failed:', error);
          }
        })();
      `;
      webviewElement.executeJavaScript(injectionCode).catch(error =>
        console.error('Gemini fix injection failed:', error)
      );
    }

    function escapeHtml(value) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(value).replace(/[&<>"']/g, char => map[char]);
    }

    function smartCommand(input) {
      if (!input || typeof input !== 'string') return '';
      const raw = input.trim();
      const text = raw.toLowerCase();

      if (text.startsWith('http://') || text.startsWith('https://')) return raw;
      if (text.includes('.') && !text.includes(' ')) return 'https://' + raw;

      const keywords = {
        youtube: 'https://www.youtube.com',
        yt: 'https://www.youtube.com',
        facebook: 'https://www.facebook.com',
        fb: 'https://www.facebook.com',
        gmail: 'https://mail.google.com',
        maps: 'https://maps.google.com',
        twitter: 'https://twitter.com',
        x: 'https://twitter.com',
        whatsapp: 'https://web.whatsapp.com',
        github: 'https://github.com',
        reddit: 'https://www.reddit.com'
      };

      for (const keyword in keywords) {
        if (text === keyword || text.includes(keyword)) return keywords[keyword];
      }

      if (text.startsWith('play ') || text.startsWith('شغل ')) {
        const query = raw.replace(/^play\s+/i, '').replace(/^شغل\s+/i, '');
        return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query);
      }

      if (['open new tab', 'افتح تبويب', 'فتح تبويب', 'new tab'].includes(text)) return '__COMMAND__NEW_TAB';
      if (['close tab', 'اغلق التبويب', 'اغلق تاب'].includes(text)) return '__COMMAND__CLOSE_TAB';
      if (['clear tabs', 'اغلق الكل', 'close all tabs'].includes(text)) return '__COMMAND__CLOSE_ALL';

      return 'https://www.google.com/search?q=' + encodeURIComponent(raw);
    }

    // One stable browser profile for all sites, regardless of how a tab was opened.
    // Cookies remain scoped to their own domains by Chromium.
    function getPartitionForUrl(_url) {
      return 'persist:helwan-ai-gate';
    }

    function createTab(url, name, displayName = null) {
      const tabsContainer = $id('tabs-container');
      const content = $id('content');
      if (!tabsContainer || !content) return;

      let finalUrl = url || 'about:blank';
      if (!/^https?:\/\//i.test(finalUrl) && !finalUrl.startsWith('about:') && !finalUrl.startsWith('__COMMAND__')) {
        finalUrl = 'https://' + finalUrl;
      }

      const tabId = name || `tab-${Date.now()}`;
      const tabElement = document.createElement('div');
      tabElement.className = 'tab';
      tabElement.id = tabId;

      const tabText = displayName || (String(name || 'Site').split('-')[0] || 'Site');
      tabElement.innerHTML = `<span class="tab-label">${escapeHtml(tabText)}</span><span class="tab-close">&times;</span>`;
      tabsContainer.appendChild(tabElement);

      const webviewElement = document.createElement('webview');
      webviewElement.className = 'webview-page';
      webviewElement.id = `webview-${tabId}`;

      // Set partition BEFORE src. Do not use tabId: it changes whenever a tab is recreated.
      webviewElement.setAttribute('partition', getPartitionForUrl(finalUrl));
      webviewElement.setAttribute('allowpopups', '');
      webviewElement.style.flex = '1';
      webviewElement.style.width = '100%';
      webviewElement.style.height = '100%';
      webviewElement.src = finalUrl;

      content.appendChild(webviewElement);
      tabs[tabId] = { name: tabText, url: finalUrl, tabElement, webviewElement };

      tabElement.addEventListener('click', event => {
        if (event.target && event.target.classList.contains('tab-close')) closeTab(tabId);
        else switchTab(tabId);
      });

      const onNavigate = event => {
        if (activeTabId === tabId) {
          updateNavButtons(webviewElement);
          try { updateUrlBar(event.url || webviewElement.getURL()); } catch (_error) {}
        }
      };

      webviewElement.addEventListener('did-navigate', onNavigate);
      webviewElement.addEventListener('did-navigate-in-page', onNavigate);

      webviewElement.addEventListener('did-finish-load', () => {
        if (activeTabId === tabId) {
          updateNavButtons(webviewElement);
          try { updateUrlBar(webviewElement.getURL()); } catch (_error) {}
        }
        let currentUrl = finalUrl;
        try { currentUrl = webviewElement.getURL(); } catch (_error) {}
        if (/gemini\.google\.com|bard\.google\.com/i.test(currentUrl)) injectGeminiFix(webviewElement);
      });

      webviewElement.addEventListener('did-fail-load', event => {
        console.warn('Webview failed to load:', event);
      });

      switchTab(tabId);

      if (window.electronAPI && typeof window.electronAPI.sendNotification === 'function') {
        window.electronAPI.sendNotification('Site Opened', `${tabText} opened successfully.`);
      }
    }

    function switchTab(tabId) {
      if (!tabs[tabId]) return;

      if (activeTabId && tabs[activeTabId]) {
        tabs[activeTabId].tabElement.classList.remove('active');
        tabs[activeTabId].webviewElement.classList.remove('active');
        tabs[activeTabId].webviewElement.style.display = 'none';
      }

      const welcomePage = $id('welcome-page');
      if (welcomePage) welcomePage.style.display = 'none';

      tabs[tabId].tabElement.classList.add('active');
      tabs[tabId].webviewElement.classList.add('active');
      tabs[tabId].webviewElement.style.display = 'flex';
      activeTabId = tabId;

      setTimeout(() => {
        if (!tabs[tabId]) return;
        updateNavButtons(tabs[tabId].webviewElement);
        try { updateUrlBar(tabs[tabId].webviewElement.getURL() || tabs[tabId].url); }
        catch (_error) { updateUrlBar(tabs[tabId].url); }
      }, 100);

      $id('tabs-container').style.display = 'flex';
    }

    function closeTab(tabId) {
      if (!tabs[tabId]) return;
      const closedTab = tabs[tabId];

      if (closedTab.tabElement.parentNode) closedTab.tabElement.parentNode.removeChild(closedTab.tabElement);
      if (closedTab.webviewElement.parentNode) closedTab.webviewElement.parentNode.removeChild(closedTab.webviewElement);
      delete tabs[tabId];

      if (activeTabId === tabId) {
        const remaining = Object.keys(tabs);
        if (remaining.length) {
          switchTab(remaining[remaining.length - 1]);
        } else {
          activeTabId = null;
          $id('tabs-container').style.display = 'none';
          updateNavButtons(null);
          updateUrlBar('');
          $id('welcome-page').style.display = 'flex';
        }
      }
    }

    function reloadTab() {
      if (activeTabId && tabs[activeTabId]) {
        try { tabs[activeTabId].webviewElement.reload(); } catch (_error) {}
      }
    }

    function showAddSiteForm() { $id('add-site-form-container').style.display = 'block'; }
    function hideAddSiteForm() { $id('add-site-form-container').style.display = 'none'; }

    const addSiteForm = $id('add-site-form');
    addSiteForm.addEventListener('submit', event => {
      event.preventDefault();
      const name = $id('site-name-input').value.trim();
      const url = $id('site-url-input').value.trim();

      if (!name || !url) {
        alert('Please provide both name and URL.');
        return;
      }

      try {
        const parsed = new URL(url);
        if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('Invalid protocol');
      } catch (_error) {
        alert('Please enter a valid HTTP or HTTPS URL.');
        return;
      }

      window.electronAPI.addSite({ name, url });
      $id('site-name-input').value = '';
      $id('site-url-input').value = '';
      hideAddSiteForm();
    });

    urlBar.addEventListener('keypress', event => {
      if (event.key !== 'Enter') return;
      const raw = urlBar.value.trim();
      if (!raw) return;

      const result = smartCommand(raw);

      if (result === '__COMMAND__NEW_TAB') {
        createTab('about:blank', `tab-${Date.now()}`, 'New Tab');
        urlBar.value = '';
        return;
      }
      if (result === '__COMMAND__CLOSE_TAB') {
        if (activeTabId) closeTab(activeTabId);
        urlBar.value = '';
        return;
      }
      if (result === '__COMMAND__CLOSE_ALL') {
        Object.keys(tabs).forEach(closeTab);
        urlBar.value = '';
        return;
      }

      if (activeTabId && tabs[activeTabId]) {
        try {
          const activeWebview = tabs[activeTabId].webviewElement;
          if (typeof activeWebview.loadURL === 'function') activeWebview.loadURL(result);
          else activeWebview.src = result;
        } catch (_error) {
          tabs[activeTabId].webviewElement.src = result;
        }
        tabs[activeTabId].url = result;
      } else {
        createTab(result, `tab-${Date.now()}`, raw);
      }
    });

    backButton.addEventListener('click', () => {
      if (activeTabId && tabs[activeTabId]) {
        const view = tabs[activeTabId].webviewElement;
        try { if (view.canGoBack()) view.goBack(); } catch (_error) {}
      }
    });

    forwardButton.addEventListener('click', () => {
      if (activeTabId && tabs[activeTabId]) {
        const view = tabs[activeTabId].webviewElement;
        try { if (view.canGoForward()) view.goForward(); } catch (_error) {}
      }
    });

    reloadButton.addEventListener('click', reloadTab);

    window.addEventListener('load', () => {
      loadSites();
      updateNavButtons(null);
      updateUrlBar('');
      if ($id('tabs-container').children.length === 0) $id('tabs-container').style.display = 'none';
    });

    if (window.electronAPI) {
      window.electronAPI.onSitesData(data => renderSites(data || []));
      window.electronAPI.onSiteAddedSuccessfully(() => {
        window.electronAPI.sendNotification('Site Added', 'Site added successfully!');
        loadSites();
      });
      window.electronAPI.onSiteDeletedSuccessfully(() => {
        window.electronAPI.sendNotification('Site Deleted', 'Site deleted successfully!');
        loadSites();
      });
    }

    window.helwan = { createTab, closeTab, smartCommand };

    function updateClock() {
      const clock = $id('clock-display');
      if (clock) clock.textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    const notepadBtn = $id('notepad-btn');
    const notepadContainer = $id('notepad-container');
    const notepadText = $id('notepad-text');
    const notepadCloseBtn = $id('notepad-close-btn');
    const notepadClearBtn = $id('notepad-clear-btn');

    function showNotepad() {
      notepadContainer.style.display = 'flex';
      notepadText.value = localStorage.getItem('helwan-notes') || '';
      notepadContainer.setAttribute('aria-hidden', 'false');
    }

    function hideNotepad() {
      notepadContainer.style.display = 'none';
      notepadContainer.setAttribute('aria-hidden', 'true');
    }

    notepadBtn.addEventListener('click', showNotepad);
    notepadCloseBtn.addEventListener('click', hideNotepad);
    notepadClearBtn.addEventListener('click', () => {
      if (!confirm('Clear all notes?')) return;
      notepadText.value = '';
      localStorage.removeItem('helwan-notes');
    });
    notepadText.addEventListener('input', () => {
      localStorage.setItem('helwan-notes', notepadText.value);
    });
  </script>
</body>
</html>
